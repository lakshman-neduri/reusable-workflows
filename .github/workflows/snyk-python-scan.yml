name: Snyk Python Scan

permissions:
    id-token: write
    contents: read

on:
  workflow_call:
    inputs:
      snyk_org_id:
        description: "Snyk Organization ID"
        required: true
        type: string

      snyk_severity_threshold:
        description: "Snyk severity threshold"
        required: false
        type: string
        default: "high"

    secrets:
      SNYK_TOKEN:
        required: true

jobs:
  snyk_scan:
    name: Snyk Python Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Find requirements files
        id: find_requirements
        shell: bash
        run: |
          files=$(find . -name "requirements.txt" -type f)

          if [ -z "$files" ]; then
            echo "No requirements.txt files found"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found requirements files:"
          echo "$files"

          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        if: steps.find_requirements.outputs.found == 'true'
        shell: bash
        run: |
          files="${{ steps.find_requirements.outputs.files }}"

          while IFS= read -r file; do
            echo "Installing dependencies from $file"

            pip install -r "$file"
          done <<< "$files"

      - name: Snyk Test
        if: steps.find_requirements.outputs.found == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          files="${{ steps.find_requirements.outputs.files }}"

          while IFS= read -r file; do
            echo "Scanning $file"

            snyk test \
              --file="$file" \
              --package-manager=pip \
              --severity-threshold=${{ inputs.snyk_severity_threshold }} \
              --command=python3
          done <<< "$files"

      - name: Snyk Monitor
        if: success() && steps.find_requirements.outputs.found == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          files="${{ steps.find_requirements.outputs.files }}"

          while IFS= read -r file; do
            echo "Monitoring $file"

            snyk monitor \
              --org="${{ inputs.snyk_org_id }}" \
              --file="$file" \
              --package-manager=pip \
              --command=python3
          done <<< "$files"